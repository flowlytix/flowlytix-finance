:root{--bg:#F3F6FB;--surface:#fff;--sunk:#EEF2F8;--line:#DCE3EE;--fg:#0D1B3E;--muted:#56637E;--accent:#1668E3;--teal:#00C2A8;--good:#007F6E;--warn:#B26A00;--bad:#C93A4B;--grad:linear-gradient(90deg,#1A7AFF 0%,#00C2A8 100%);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1430;--surface:#111D3F;--sunk:#0E1936;--line:#22325C;--fg:#E8EEFB;--muted:#9DADCC;--accent:#5B9BFF;--good:#2FE0C4;--warn:#FFB547;--bad:#FF7088;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1430;--surface:#111D3F;--sunk:#0E1936;--line:#22325C;--fg:#E8EEFB;--muted:#9DADCC;--accent:#5B9BFF;--good:#2FE0C4;--warn:#FFB547;--bad:#FF7088;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Anuphan",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:58px}
.wm{display:inline-flex;align-items:baseline;gap:7px;text-decoration:none;white-space:nowrap}
.wm-a{font:700 17px/1 "Anuphan",sans-serif;letter-spacing:.09em;color:var(--fg)}
.wm-b{font:700 18px/1 "Anuphan",sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:2px}
.sp{flex:1}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;color:var(--muted);font:600 12.5px "Anuphan",sans-serif;padding:4px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 22px;font:600 16px "Anuphan",sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.pri{background:var(--grad);color:#fff;border:0;box-shadow:0 8px 22px rgba(26,122,255,.28)}
.lnk{border:0;background:none;color:var(--muted);font:500 15px "Anuphan",sans-serif;cursor:pointer;padding:8px 4px;text-decoration:underline}
.eyebrow{display:inline-block;font:600 13px "Anuphan",sans-serif;color:var(--good);background:color-mix(in srgb,var(--teal) 14%,transparent);padding:3px 12px;border-radius:999px;margin-bottom:12px}
h1{font:700 clamp(30px,4.6vw,46px)/1.15 "Anuphan",sans-serif;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
h1 .g,.g2{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h2{font:700 21px/1.35 "Anuphan",sans-serif;margin:0 0 12px;text-wrap:balance}
.lead{font-size:18px;color:var(--muted);margin:0 0 20px}
.fine{font-size:13.5px;color:var(--muted);margin:12px 0 0}
.tiger{display:block;height:auto}
.intro{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:center;padding:44px 0 56px}
.intro .tiger.big{width:260px;animation:tg 4s ease-in-out infinite}
@keyframes tg{0%,100%{translate:0 0}50%{translate:0 -8px}}
@media (prefers-reduced-motion:reduce){.tiger{animation:none!important}}
.qbox{padding:28px 0 48px}
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .3s}
.pn{font-size:13px;color:var(--muted);margin:6px 0 14px}
.qcard,.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(13,27,62,.06)}
.tag{display:inline-block;font-size:12.5px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:2px 10px;border-radius:99px;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:16px;padding:14px 16px;font:500 16px/1.45 "Anuphan",sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.nav{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px;margin:14px 0;font-size:14.5px;font-weight:600}
.fld input,.bf input,.bf select{font:500 16px "Anuphan",sans-serif;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);width:100%}
.fld input{max-width:260px;text-align:right}
.sub{font-weight:600;margin:18px 0 8px}
.bills{display:flex;flex-direction:column;gap:8px}
.bill{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}.bill.on{border-color:color-mix(in srgb,var(--teal) 60%,var(--line));background:color-mix(in srgb,var(--teal) 6%,var(--surface))}
.bt{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:500}.bt input{width:20px;height:20px;accent-color:#00A892}
.bf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 2px 30px}.bf input{width:130px;text-align:right}.bf select{width:auto}.bf .fine{margin:0}
.res{padding:28px 0 48px;display:flex;flex-direction:column;gap:18px}
.rhead{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center}.rhead .tiger{width:200px}
.nums .big{font-size:17px;margin:0 0 14px}
.yr{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:138px;margin:4px 0 14px}
.ym{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;min-width:0}
.ym i{display:block;width:70%;max-width:26px;border-radius:6px 6px 3px 3px;background:color-mix(in srgb,var(--accent) 45%,var(--sunk))}.ym i.hot{background:linear-gradient(180deg,#FF9F43,#F2B233)}
.yv{font-size:11px;color:var(--muted);white-space:nowrap}.yl{font-size:11px;color:var(--muted)}
.nums p{margin:8px 0 0}.nums p.ok{background:color-mix(in srgb,var(--teal) 12%,transparent);border-radius:12px;padding:10px 12px}
.areas{display:flex;flex-direction:column;gap:10px}
.area{border:1px solid var(--line);border-left:5px solid var(--good);border-radius:14px;padding:12px 14px}.area.warn{border-left-color:var(--warn)}.area.bad{border-left-color:var(--bad)}
.area p{margin:6px 0 0;font-size:15px}.area .fix{color:var(--muted)}
.ah{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pill{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}.pill.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.cta{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;align-items:start}.cta .tiger{width:120px}
.cta .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:13.5px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
[data-l]{display:none}
html[lang="en"] [data-l="en"],html[lang="th"] [data-l="th"]{display:revert}
[hidden]{display:none!important}
@media (max-width:640px){.intro{grid-template-columns:minmax(0,1fr);text-align:center;padding:24px 0 40px;gap:12px}.intro .tiger.big{width:180px;margin:0 auto}.intro .btn{width:100%}
 .rhead{grid-template-columns:96px minmax(0,1fr);gap:14px}.rhead .tiger{width:96px}.rhead h1{font-size:28px}.rhead .lead{font-size:15.5px;margin:0}
 .qcard,.card{padding:18px;border-radius:18px}h2{font-size:19px}.cta{grid-template-columns:minmax(0,1fr)}.cta .tiger{width:90px}.cta .btn{width:100%}
 .bf{margin-left:0}.yr{gap:2px}.yv{font-size:9.5px}.yl{font-size:10px}}
</style>

const tiger=(cls,size)=>`<img class="tiger ${cls||""}" src="/mascot/tiger-${size||320}.webp" alt="" width="${size||320}" height="${size||320}">`;

function billMonths(k){ const row=BILLS.find(r=>r[0]===k), b=S.bills[k]; return row[4].map((x,i)=>typeof x==="string"?S.bills[x].mons[0]:b.mons[i]); }
/* your yearly bills over the next 12 months, from this month */
function calc(){ const pay=num(S.pay), months=Array.from({length:12},(_,i)=>((nowMo-1+i)%12)+1), due={};
  let total=0; BILLS.forEach(([k])=>{ const b=S.bills[k]; if(!b.on) return; const amt=num(b.amt); if(!(amt>0)) return; billMonths(k).forEach(mo=>{ if(!mo) return; due[mo]=(due[mo]||0)+amt; total+=amt; }); });
  let worst=0, worstMo=0; months.forEach(mo=>{ if((due[mo]||0)>worst){ worst=due[mo]; worstMo=mo; } });
  return {pay,total,worst,worstMo,perMonth:Math.ceil(total/12/100)*100,months,due,pct:pay>0?worst/pay:0}; }
function areaScore(k){ return QS.reduce((s,q,i)=>s+(q.a===k&&S.ans[i]!=null?q.o[S.ans[i]][0]:0),0); }
function status(k,c){ let sc=areaScore(k), st=sc>=4?"ok":sc>=2?"warn":"bad";
  if(k==="bills"&&c.total>0&&c.pct>=0.3&&QS[0].o[S.ans[0]]?.[0]!==2&&st==="ok") st="warn";
  if(k==="bills"&&c.total>0&&c.pct>=0.5&&QS[0].o[S.ans[0]]?.[0]!==2) st="bad";
  return st; }

      <p>${c.pay>0?T(`Your heaviest month is <b>${mName(c.worstMo-1,true)}</b>: <b>${baht(c.worst)}</b> in one go, <b>${pctTxt} of your take-home</b> that month.`,`เดือนที่หนักที่สุดคือ <b>${mName(c.worstMo-1,true)}</b>: <b>${baht(c.worst)}</b> ในก้อนเดียว เท่ากับ <b>${pctTxt} ของเงินเดือนสุทธิ</b> เดือนนั้น`)
        :T(`Your heaviest month is <b>${mName(c.worstMo-1,true)}</b>: <b>${baht(c.worst)}</b> in one go.`,`เดือนที่หนักที่สุดคือ <b>${mName(c.worstMo-1,true)}</b>: <b>${baht(c.worst)}</b> ในก้อนเดียว`)}</p>
      <p class="ok">${T(`Setting aside about <b>${baht(c.perMonth)} a month</b> covers them all (a little more at first for bills that are close). That's what Bills ahead and the Pocket plan work out for you, bill by bill.`,`กันเงินประมาณ <b>เดือนละ ${baht(c.perMonth)}</b> ก็พอจ่ายทุกบิล (ช่วงแรกอาจต้องกันมากขึ้นนิดหน่อยสำหรับบิลที่ใกล้ถึง) นี่คือสิ่งที่ บิลล่วงหน้า และ พ็อกเก็ตแพลน คำนวณให้ทีละบิล`)}</p></div>`; }
  h+=`<div class="card"><h2>${T("Your 5 money areas","การเงิน 5 ด้านของคุณ")}</h2><div class="areas">${sts.slice().sort((a,b)=>order[a.s]-order[b.s]).map(a=>`<div class="area ${a.s}"><div class="ah"><b>${T(a.en,a.th)}</b><span class="pill ${a.s}">${lbl[a.s]}</span></div>
    ${a.s==="ok"?`<p>${T("Good habit. Keep it up.","นิสัยดี รักษาไว้นะ")}</p>`:`<p>${T(RISK[a.k][0],RISK[a.k][1])}</p><p class="fix">${T("In Money:","ใน Money:")} <b>${T(FIX[a.k].f[0],FIX[a.k].f[1])}</b>. ${T(FIX[a.k].h[0],FIX[a.k].h[1])}</p>`}</div>`).join("")}</div></div>`;
  h+=`<div class="card cta">${tiger("sm",160)}<div><h2>${weak.length?T("Fix these with a plan, not willpower","แก้ด้วยแผน ไม่ใช่ด้วยการฝืนใจ"):T("Keep it this easy every month","ทำให้ง่ายแบบนี้ทุกเดือน")}</h2>
    <p>${c.total>0||num(S.pay)>0?T("Your answers fill in the 2-minute plan for you: check it, then save it to your own Google Drive.","คำตอบของคุณจะกรอกแผน 2 นาทีให้เลย ตรวจดูแล้วบันทึกลง Google Drive ของคุณเอง"):T("Make your first plan in 2 minutes, free, then save it to your own Google Drive.","ทำแผนแรกใน 2 นาที ฟรี แล้วบันทึกลง Google Drive ของคุณเอง")}</p>
    <div class="row"><button type="button" class="btn pri" data-plan="1">${c.total>0||num(S.pay)>0?T("Plan my year with these numbers","วางแผนทั้งปีด้วยตัวเลขนี้"):T("Plan my year in 2 minutes","วางแผนทั้งปีใน 2 นาที")}</button>
    <button type="button" class="btn" data-share="1">${T("Share my money style","แชร์สไตล์การเงินของฉัน")}</button></div>
    <p class="fine">${T("Rules of thumb, not financial advice. Nothing you typed here has left this device.","เป็นหลักการทั่วไป ไม่ใช่คำแนะนำทางการเงิน สิ่งที่คุณกรอกไม่ได้ออกจากอุปกรณ์นี้")}</p>
    <p class="fine"><button type="button" class="lnk" data-go="1">${T("Take the check again","ทำแบบเช็กอีกครั้ง")}</button></p></div></div></section>`;
  if(!S.done){ S.done=true; ev("check_complete",{style:st.k}); }
  S.style=st; return h; }

const app=document.getElementById("ck");
function draw(){ app.innerHTML=view(); }
app.addEventListener("click",e=>{ const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.go!=null){ const g=+t.dataset.go; if(g===1&&S.step===0) ev("check_start"); if(g===1&&S.step===STEP_RES){ S.ans={}; S.done=false; } S.step=g; draw(); scrollTo(0,0); return; }
  if(t.dataset.ans!=null){ S.ans[S.step-1]=+t.dataset.ans; draw(); setTimeout(()=>{ S.step++; draw(); scrollTo(0,0); },180); return; }
  if(t.dataset.res!=null){ if(t.dataset.res==="skip"){ S.pay=""; BILLS.forEach(([k])=>S.bills[k].on=false); } S.step=STEP_RES; draw(); scrollTo(0,0); return; }
  if(t.dataset.plan){ ev("check_plan_click"); toQuick(); return; }
  if(t.dataset.share){ ev("check_share",{style:S.style?.k}); share(); return; } });
app.addEventListener("input",e=>{ const t=e.target;
  if(t.id==="pay") S.pay=t.value;
  if(t.dataset.bamt){ const b=S.bills[t.dataset.bamt]; b.amt=t.value; b.t=true; } });
app.addEventListener("change",e=>{ const t=e.target;
  if(t.dataset.bon){ S.bills[t.dataset.bon].on=t.checked; draw(); }
  if(t.dataset.bmon){ const b=S.bills[t.dataset.bmon]; b.mons[+t.dataset.i]=+t.value; b.tm[+t.dataset.i]=true; }
  if(t.id==="pay"||t.dataset.bamt){ const n=num(t.value); if(n>0) t.value=n.toLocaleString("en-US"); } });

/* hand the numbers to the app's quick start (same format as index.html qsFresh: v:1) and open it */
function toQuick(){ try{ let q=null; try{ q=JSON.parse(localStorage.getItem("fx_qs")||"null"); }catch(e){}
    if(!q||q.v!==1) q={v:1,step:0,pay:"",payday:"",m:null,y:{}};
    q.step=1; if(num(S.pay)>0) q.pay=String(num(S.pay));
    q.y=q.y||{}; BILLS.forEach(([k,,,a,ms])=>{ const b=S.bills[k]; if(!b.on){ if(q.y[k]) q.y[k].on=false; return; }
      const linked=typeof ms[0]==="string";
      q.y[k]={on:true,amt:num(b.amt),t:b.t||num(b.amt)!==a,mons:linked?[0]:b.mons.slice(),tm:linked?[false]:b.mons.map((m,i)=>b.tm[i]||(typeof ms[i]==="number"&&ms[i]>0&&m===ms[i]))}; });
    if(!q.m) delete q.m; q.from="check";
    localStorage.setItem("fx_qs",JSON.stringify(q)); }catch(e){}
  location.href="/?quick=1"+(L==="th"?"&lang=th":""); }
function share(){ const st=S.style||STYLES[3], url="https://money.flowlytix.co/check"+(L==="th"?"?lang=th":""),
    text=T(`My money style is "${st.en}". What's yours? 2-minute money check, free:`,`สไตล์การเงินของฉันคือ "${st.th}" แล้วคุณล่ะ? เช็กนิสัยการเงิน 2 นาที ฟรี:`);
  if(navigator.share){ navigator.share({title:"Flowlytix Money",text,url}).catch(()=>{}); return; }
  try{ navigator.clipboard.writeText(text+" "+url); toast(T("Link copied. Paste it anywhere to share.","คัดลอกลิงก์แล้ว วางเพื่อแชร์ได้เลย")); }catch(e){} }
function toast(m){ let el=document.getElementById("toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=m; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }

(()=>{ try{ const q=new URLSearchParams(location.search).get("lang"), s=localStorage.getItem("bp_lang");
    L=q==="th"||q==="en"?q:s==="th"||s==="en"?s:(/^th/i.test(navigator.language||"")?"th":"en"); }catch(e){}
  const set=l=>{ L=l; document.documentElement.lang=l; try{localStorage.setItem("bp_lang",l);}catch(e){}
    document.querySelectorAll("[data-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.set===l)));
    document.title=l==="th"?"เช็กนิสัยการเงิน 2 นาที · Flowlytix Money":"2-minute money habits check · Flowlytix Money"; draw(); };
  document.querySelectorAll("[data-set]").forEach(b=>b.addEventListener("click",()=>{ set(b.dataset.set); try{ const u=new URL(location.href); if(u.searchParams.has("lang")){ u.searchParams.delete("lang"); history.replaceState(null,"",u.toString()); } }catch(e){} }));
  set(L); })();
</script>
